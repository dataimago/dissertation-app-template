# The thesis book, when it lives in this repository. dissertation.ai copies
# these files into thesis/ at provisioning when the book's home is here (no R
# package of its making); the template itself does not ship them, and an
# entry whose file is not there is ignored. They are named one by one. The
# files the author writes under thesis/ (chapters/, index.qmd,
# references.bib, _quarto.yml, ai-contribution-statement.qmd) have no entry,
# and neither has a profile the author writes. Only the house profile is
# copied at provisioning. A profile copied in later from the thesis-class
# registry is dataimago's too, under the same MIT terms. Its name is not
# known ahead of time: add its two paths to the list just below, as
#   "thesis/profiles/<id>.cfg",
#   "thesis/profiles/<id>.yaml",

# dataimago's thesis tooling and the profiles.
[[annotations]]
path = [
  "thesis/THESIS-CLS-README.md",
  "thesis/_environment",
  "thesis/profiles/house.cfg",
  "thesis/profiles/house.yaml",
  "thesis/thesis-class/check-pdf-fonts.sh",
  "thesis/thesis-class/registry-source.json",
  "thesis/thesis-class/sync.py",
]
SPDX-FileCopyrightText = "2026 dataimago"
SPDX-License-Identifier = "MIT"

