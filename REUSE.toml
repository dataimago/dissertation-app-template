# What dataimago licenses in this repository, file by file (REUSE 3.3,
# https://reuse.software/spec-3.3/).
#
# This repository has no LICENSE file at its root on purpose. The files
# listed here came from dataimago's dissertation-app-template and are
# MIT-licensed by dataimago; the text is in LICENSES/MIT.txt. Everything
# else in the repository is the author's own work. This file says nothing
# about it and gives nobody a right to reuse it.
#
# The lists name files one by one, with no wildcards, so a file the author
# adds is never covered. Three files that came from the template are left
# out, with no notice at all, because they are where the author's own
# material goes: dataimago-spec.yaml (the project's record), raw/MANIFEST.md
# (what the author brought) and wiki/assets/site.scss (the site's own rules).
#
# writing/STYLE.md carries its notice in the file itself and is not listed
# here. The notice licenses the whole file; a style guide of the author's
# own replaces the file and leaves the notice out.
#
# An entry here stays true only while the file is still the template's. If
# you replace a listed file with your own, delete its line.
#
# The empty .gitkeep placeholders are listed too, so that every file the
# template ships is accounted for.
#
# An entry here stays true only while the file is still the template's. If
# you replace a listed file with your own, delete its line.
#
# `precedence` is left at its default (`closest`): a copyright and licence
# header inside a file replaces the entry for that file here, for the whole
# file.

