# What dataimago licenses in this repository, file by file (REUSE 3.3,
# https://reuse.software/spec-3.3/).
#
# This repository has no LICENSE file at its root on purpose. The files
# listed here came from dataimago's dissertation-app-template. The first
# list is dataimago's own files, MIT-licensed, text in LICENSES/MIT.txt. The
# second is the Noto fonts, which belong to the Noto Project Authors under
# the SIL Open Font License 1.1, text in LICENSES/OFL-1.1.txt. The last two
# lists are for the thesis book when dissertation.ai puts it in this
# repository: dataimago's thesis tooling and profiles, MIT, and the house
# thesis class, under the LaTeX Project Public License 1.3c or later, text
# in LICENSES/LPPL-1.3c.txt. The files in LICENSES/ are the licence texts
# themselves: REUSE does not list them, and they stay with the files they
# license. Everything else the author wrote is the author's own work. This
# file says nothing about it and gives nobody a right to reuse it. A file
# that came from somewhere else keeps its owner's terms, whoever put it here
# and whether or not it has a line here: a profile from the thesis-class registry is dataimago's,
# MIT, and its two paths belong in the "thesis tooling and the profiles"
# list below, beside the house profile's.
#
# The lists name files one by one, with no wildcards, so a file the author
# adds is never covered. Three files that came from the template are left
# out, with no notice at all, because they are where the author's own
# material goes: dataimago-spec.yaml (the project's record), raw/MANIFEST.md
# (what the author brought) and wiki/assets/site.scss (the site's own rules).
#
# writing/STYLE.md carries its notice in the file itself and is not listed
# here. The notice licenses the whole file; a style guide of the author's
# own replaces the file and leaves the notice out.
#
# The empty .gitkeep placeholders are listed too, so that every file the
# template ships is accounted for.
#
# An MIT entry here stays true only while the file is still the template's.
# If you replace such a file with your own, delete its line. The thesis
# class and the fonts are different: their terms are in the files and in
# LICENSES/, and stay with them whether or not their lines remain here.
#
# `precedence` is left at its default (`closest`): a copyright and licence
# header inside a file replaces the entry for that file here, for the whole
# file.

version = 1

