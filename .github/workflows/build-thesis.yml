name: Build thesis PDF
#
# Content-only (no-R) dissertations host the thesis bundle directly in this app
# repo's `thesis/` (provisioned by dissertation.ai from the canonical rpkg
# template). The build is pure Quarto + LuaLaTeX — no R — so this is the rpkg
# template's build-thesis.yml minus the R setup steps, working in `thesis/`:
# Quarto + LuaLaTeX on a CTAN TeX Live, building the house class (thesis/thesis-class/)
# with the profile `thesis.profile` names (thesis/profiles/). Keep the TeX Live and
# font steps equal to the rpkg template's.
#
# R-bearing dissertations build their PDF in the R package instead; they never
# populate `thesis/`, so the `thesis/**` path trigger never fires here and the
# real steps are additionally guarded on `thesis/` existing.
#
on:
  push:
    branches: [main]
    paths:
      - 'thesis/**'
  workflow_dispatch: {}

jobs:
  build:
    # Skipped on the template repo itself (it ships no `thesis/` + placeholders).
    if: github.repository != 'dataimago/dissertation-app-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9 # the version the house class's own CI renders with

      # The house class builds with LuaLaTeX (a tagged, accessible PDF) and its
      # fonts, TeX Gyre, come from TeX Live. Tagging needs a current LaTeX, so
      # install TeX Live from CTAN instead of using a distro or TinyTeX
      # snapshot; the installed tree is cached. The package list is the one the
      # house class's CI installs (tools/texlive-packages.txt in
      # dataimago/dissertation-thesis-classes), plus what Pandoc's template needs. Bumping the vendored class
      # (registry-source.json changes) or this list changes rebuilds the cache.
      - name: System packages
        if: hashFiles('thesis/_quarto.yml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends perl fontconfig poppler-utils
      - name: Cache TeX Live
        id: tl-cache
        if: hashFiles('thesis/_quarto.yml') != ''
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-2026-${{ runner.os }}-${{ hashFiles('thesis/thesis-class/registry-source.json', '.github/workflows/build-thesis.yml') }}
      - name: Install TeX Live
        if: hashFiles('thesis/_quarto.yml') != '' && steps.tl-cache.outputs.cache-hit != 'true'
        run: |
          TL="$HOME/texlive"
          mkdir -p /tmp/tlinst && cd /tmp/tlinst
          curl -fsSL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz | tar xz --strip-components=1
          cat > profile.txt <<EOP
          selected_scheme scheme-medium
          TEXDIR $TL
          TEXMFLOCAL $TL/texmf-local
          TEXMFSYSCONFIG $TL/texmf-config
          TEXMFSYSVAR $TL/texmf-var
          TEXMFHOME $TL/texmf-home
          instopt_adjustpath 0
          instopt_adjustrepo 1
          tlpdbopt_autobackup 0
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          EOP
          perl ./install-tl --profile profile.txt --no-interaction
          BIN=$(ls -d "$TL"/bin/*)
          "$BIN/tlmgr" install tex-gyre tex-gyre-math luamml tagpdf latex-lab latexmk selnolig xurl bookmark pdflscape caption unicode-math fontspec setspace
          # What Pandoc's LaTeX template needs beyond scheme-medium (code blocks, tables,
          # callouts), found by rendering the starter book. A package your own content
          # needs is added to this line.
          "$BIN/tlmgr" install framed footnotehyper booktabs fancyvrb float xcolor colorprofiles tcolorbox fontawesome5 pgf
          "$BIN/tlmgr" --version
      - name: Put TeX Live on PATH and register its fonts with fontconfig
        if: hashFiles('thesis/_quarto.yml') != ''
        run: |
          BIN=$(ls -d "$HOME"/texlive/bin/*)
          echo "$BIN" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.config/fontconfig/conf.d"
          cp "$HOME/texlive/texmf-var/fonts/conf/texlive-fontconfig.conf" "$HOME/.config/fontconfig/conf.d/09-texlive.conf"
          fc-cache -f
          fc-list | grep -m3 -i "TeX Gyre Termes"

      - name: Render thesis PDF
        if: hashFiles('thesis/_quarto.yml') != ''
        working-directory: thesis
        run: quarto render --to pdf

      - name: Upload PDF artifact
        if: hashFiles('thesis/_quarto.yml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: docs/thesis.pdf
          retention-days: 30

      - name: Commit rendered PDF to repo
        if: github.event_name == 'push' && hashFiles('thesis/_quarto.yml') != ''
        run: |
          git config user.name "dataimago-thesis-bot"
          git config user.email "thesis-bot@dataimago.ai"
          git add -f docs/thesis.pdf  # -f: docs/ is gitignored build output
          if ! git diff --staged --quiet; then
            git commit -m "chore(thesis): rebuild PDF [skip ci]"
            # Another push may have advanced the branch while this build ran
            # (e.g. the author pushed again moments later). Rebase onto the
            # latest remote before pushing so the commit-back doesn't fail with
            # "Updates were rejected (fetch first)" — the race seen on rapid
            # successive pushes. Retry a few times; fail loudly if it can't push.
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
                pushed=true; break
              fi
              echo "commit-back attempt $attempt failed; retrying after rebase…"
              sleep 3
            done
            if [ "$pushed" != true ]; then
              echo "::error::could not push the rebuilt thesis PDF after 3 attempts"
              exit 1
            fi
          fi

      # Last, so the author still gets the PDF: LaTeX falls back to another
      # font without an error, so check the fonts the PDF embeds (the profile's
      # main and math fonts, all embedded, no Latin Modern Math fallback).
      # Skipped when _quarto.yml does not use the house class (a vendored class has its own
      # fonts); fails when it does and the check script is missing (a partial copy).
      - name: Check the PDF's fonts
        if: hashFiles('thesis/_quarto.yml') != ''
        run: |
          if ! grep -q '^ *documentclass: *dataimago-thesis' thesis/_quarto.yml; then
            echo "Not the house class (a vendored class, or the older thesis.cls layout): the font check does not apply."
          elif [ ! -f thesis/thesis-class/check-pdf-fonts.sh ]; then
            echo "::error::_quarto.yml uses the house class but thesis/thesis-class/check-pdf-fonts.sh is missing. Restore thesis-class/ from the commit in thesis-class/registry-source.json (python3 thesis/thesis-class/sync.py sync)."
            exit 1
          else
            sh thesis/thesis-class/check-pdf-fonts.sh thesis docs/thesis.pdf
          fi
